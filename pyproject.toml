[project]
name = "gcs-bridge"
version = "0.1.0"
description = "FastAPI service bridging uploads to Gemini File API with caching."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.111.0",
  "uvicorn[standard]>=0.30.0",
  "pydantic-settings>=2.0.0",
  "google-generativeai>=0.8.0",
  "aioboto3>=13.0.0",
  "boto3>=1.34.0",
  "redis>=5.0.0",
  "httpx>=0.27.0",
  "python-multipart>=0.0.9",
  "python-dotenv>=1.0.0",
  "loguru>=0.7.0",
  "pyflow-ai-stack>=0.1.0",
]

[dependency-groups]
dev = [
  "pytest>=8.0.0",
  "pytest-asyncio>=0.23.0",
  "pytest-cov>=5.0.0",
  "black>=24.0.0",
  "isort>=5.13.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term --cov-fail-under=90"

[tool.black]
line-length = 88

[tool.isort]
profile = "black"
